name: Update version

on:
  push:
    branches: [main, hwfc]

# Skip if this is the auto-commit from the action itself
jobs:
  version:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate version info and update files
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD=$(git rev-list --count HEAD)
          VERSION="0.1.${BUILD}"

          echo "Version: ${VERSION}  Commit: ${COMMIT}  Date: ${DATE}"

          # Write version.json
          cat > version.json <<EOF
          {"version":"${VERSION}","commit":"${COMMIT}","date":"${DATE}","build":${BUILD}}
          EOF

          # Update the CACHE_VERSION constant in sw.js so the browser detects
          # the SW file has changed and triggers the update flow
          sed -i "s/const CACHE_VERSION = '[^']*';/const CACHE_VERSION = '${COMMIT}';/" sw.js

      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json sw.js
          git diff --staged --quiet \
            || git commit -m "chore: update version [skip ci]" && git push
