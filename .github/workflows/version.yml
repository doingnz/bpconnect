name: Update version

on:
  push:
    branches: [main, hwfc]

jobs:
  version:
    # Don't run on the auto-commit this action produces
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate version info and update files
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD=$(git rev-list --count HEAD)
          VERSION="0.1.${BUILD}"

          echo "Version: ${VERSION}  Commit: ${COMMIT}  Build: ${BUILD}"

          # Write version.json (printf avoids any leading-whitespace issues)
          printf '{"version":"%s","commit":"%s","date":"%s","build":%s}\n' \
            "${VERSION}" "${COMMIT}" "${DATE}" "${BUILD}" > version.json

          # Update CACHE_VERSION in sw.js so the browser detects the SW changed
          sed -i "s/const CACHE_VERSION = '[^']*';/const CACHE_VERSION = '${COMMIT}';/" sw.js

          cat version.json

      - name: Commit and push updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json sw.js
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update version [skip ci]"
            git push
          fi
