# Checks that the vendored SDK is what it claims to be, and that the service
# worker can still start the app offline.
#
# Both catch something silent. An SDK edited in place is lost at the next sync
# and invisible until then. An SDK file missing from PRECACHE costs nothing
# online -- the network serves it -- and stops the app starting offline, which
# is the one situation a PWA exists for.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk:
    name: Vendored SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node test/check-sdk.mjs

      - name: Every JavaScript file parses
        # `node --check` does not parse a .js file as ESM, so importing is the
        # only check that means anything for a module.
        run: |
          for f in $(find app sdk -name '*.js'); do
            node --input-type=module -e "await import('./$f').catch(e => {
              if (e instanceof SyntaxError) { console.error('$f: ' + e.message); process.exit(1); }
            })"
          done
